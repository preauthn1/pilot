# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://database-1.cluster-cfuk48i8ixca.ap-south-1.rds.amazonaws.com:3306/game_pilot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Kolkata
    username: admin
    password: REDACTED
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 10000
      min-evictable-idle-time-millis: 30000
      keep-alive: true
      keep-alive-between-time-millis: 30000
      time-between-eviction-runs-millis: 20000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
      password:
      timeout: 2000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          min-idle: 5
          max-idle: 10
          max-wait: 2000ms

# 接口文档访问认证
docs:
  auth:
    username: admin
    password: REDACTED

# IP 白名单（生产环境默认开启，请在 ams_ip_list 表中预先添加自己的 IP）
ip:
  whitelist:
    enabled: true

logging:
  level:
    com.politapi: debug

# 游戏服控制HTTP地址（gameserver config/http.js 中的 host:port）
game:
  control:
    url: http://127.0.0.1:9000
    key: 5dfa8c73449f6299
