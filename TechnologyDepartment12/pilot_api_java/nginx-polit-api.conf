# ============================================
# polit-api Nginx 反向代理配置
# 双实例滚动部署 — 零停机更新
# ============================================
# 部署方式：
#   1. upstream 块粘贴到现有 server {} 前面
#   2. location ^~ /admin/ 和 location ^~ /api/ 粘贴到 server {} 内
#      放在静态文件 location ~ 前面，^~ 确保代理优先于正则匹配
#   3. 检查 /www/server/panel/vhost/rewrite/api.flygame.xyz.conf
#      删掉其中匹配 /admin 或 /api 的 rewrite 规则，避免冲突
#   4. nginx -t && nginx -s reload
# ============================================

# ---- 第 1 步：粘贴到 server {} 前面 ----
upstream polit_api_backend {
    # least_conn：最少连接数，适合长连接场景
    least_conn;

    # 实例 A（端口 8880）
    server 127.0.0.1:8880 max_fails=2 fail_timeout=10s;
    # 实例 B（端口 8881）
    server 127.0.0.1:8881 max_fails=2 fail_timeout=10s;

    keepalive 32;
}

# ---- 第 2 步：以下内容粘贴到 server {} 内部 ----
# ---- 放在静态文件 location 前面 ----
server {
    # 这只是语法参考壳，实际粘贴 location 块到你的 server {} 即可

    # /admin/ — Java 后端管理接口（^~ 确保优先于正则 location）
    location ^~ /admin/ {
        proxy_pass http://polit_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # /api/ — Java 后端开放接口
    location ^~ /api/ {
        proxy_pass http://polit_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # 接口文档页面（/docs /api-docs.html /v1/api-docs 等）
    location ^~ /docs {
        proxy_pass http://polit_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api-docs.html {
        proxy_pass http://polit_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/api-docs {
        proxy_pass http://polit_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /pilot_api.postman_collection.json {
        proxy_pass http://polit_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /API_DOCUMENTATION.md {
        proxy_pass http://polit_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
